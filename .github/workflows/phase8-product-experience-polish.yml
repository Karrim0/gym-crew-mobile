name: Phase 8 Product Experience Polish

on:
  push:
    branches:
      - "phase/8-*"
    paths:
      - "package.json"
      - "package-lock.json"
      - "app.config.js"
      - "android/**"
      - "src/**"
      - "scripts/phase7-smart-presets.test.mjs"
      - "scripts/run-phase7-smart-presets-tests.mjs"
      - "scripts/verify-phase8-product-experience.mjs"
      - "VERIFY_PHASE8_PRODUCT.cmd"
      - "docs/PHASE_8_PRODUCT_EXPERIENCE_POLISH.md"
      - ".github/workflows/phase8-product-experience-polish.yml"
  pull_request:
    branches:
      - develop
    paths:
      - "package.json"
      - "package-lock.json"
      - "app.config.js"
      - "android/**"
      - "src/**"
      - "scripts/**"
      - "VERIFY_PHASE8_PRODUCT.cmd"
      - "docs/**"
      - ".github/workflows/phase8-product-experience-polish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-product-experience:
    name: Validate OVRLD 1.2 product experience
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare evidence directory
        run: mkdir -p artifacts

      - name: Verify Phase 8 product contract
        run: npm run verify:phase8 | tee artifacts/phase8-product-verification.txt

      - name: Test smart set presets
        run: npm run test:smart-presets | tee artifacts/phase8-smart-preset-tests.txt

      - name: Offline regression contracts
        run: |
          npm run verify:phase4 | tee artifacts/phase4-offline-regression.txt
          npm run verify:phase4-null-safety | tee artifacts/phase4-null-regression.txt
          npm run test:offline-policy | tee artifacts/offline-policy-tests.txt

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Check Expo dependency alignment
        run: npx expo install --check

      - name: Resolve Expo public config
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
          EXPO_PUBLIC_WEB_API_URL: https://example.com
        run: npx expo config --type public > artifacts/expo-public-config.txt

      - name: Export Android JavaScript bundle
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
          EXPO_PUBLIC_WEB_API_URL: https://example.com
        run: |
          rm -rf dist/phase8-android
          npx expo export --platform android --output-dir dist/phase8-android
          find dist/phase8-android -maxdepth 3 -type f -printf "%P\n" | sort > artifacts/android-export-files.txt
          du -sh dist/phase8-android > artifacts/android-export-size.txt

      - name: Capture release identity
        run: |
          node -e 'const p=require("./package.json"); console.log(`name=${p.name}\nversion=${p.version}`)' > artifacts/release-identity.txt
          grep -E "versionCode|versionName" android/app/build.gradle >> artifacts/release-identity.txt

      - name: Upload Phase 8 evidence
        uses: actions/upload-artifact@v4
        with:
          name: ovrld-phase8-product-experience
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
